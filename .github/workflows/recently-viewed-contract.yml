name: Validate Ultimate Commerce Recently Viewed Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  recently-viewed-contract:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'badotter' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Validate Recently Viewed PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l packages/ultimate-commerce-for-woocommerce/src/Storefront/RecentlyViewed.php >/dev/null
          php -l packages/ultimate-commerce-for-woocommerce/src/Modules/RecentlyViewed/RecentlyViewedModule.php >/dev/null
          php -l tests/recently-viewed-contract.php >/dev/null

      - name: Validate Recently Viewed browser controller syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/ultimate-commerce-for-woocommerce/assets/js/recently-viewed.js

      - name: Validate Recently Viewed ownership and privacy contract
        shell: bash
        run: |
          set -euo pipefail
          php tests/recently-viewed-contract.php
