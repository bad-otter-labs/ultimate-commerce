name: Validate Ultimate Commerce Recently Viewed Contract

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '.github/workflows/recently-viewed-contract.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package-lock.json'
      - 'package.json'
      - 'packages/ultimate-commerce-for-woocommerce/assets/js/recently-viewed.js'
      - 'packages/ultimate-commerce-for-woocommerce/src/Modules/RecentlyViewed/RecentlyViewedModule.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Plugin.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Storefront/RecentlyViewed.php'
      - 'packages/ultimate-commerce-for-woocommerce/ultimate-commerce-for-woocommerce.php'
      - 'tests/recently-viewed-contract.php'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recently-viewed-contract.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package-lock.json'
      - 'package.json'
      - 'packages/ultimate-commerce-for-woocommerce/assets/js/recently-viewed.js'
      - 'packages/ultimate-commerce-for-woocommerce/src/Modules/RecentlyViewed/RecentlyViewedModule.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Plugin.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Storefront/RecentlyViewed.php'
      - 'packages/ultimate-commerce-for-woocommerce/ultimate-commerce-for-woocommerce.php'
      - 'tests/recently-viewed-contract.php'

permissions:
  contents: read

jobs:
  recently-viewed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Validate Recently Viewed PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l packages/ultimate-commerce-for-woocommerce/src/Storefront/RecentlyViewed.php >/dev/null
          php -l packages/ultimate-commerce-for-woocommerce/src/Modules/RecentlyViewed/RecentlyViewedModule.php >/dev/null
          php -l tests/recently-viewed-contract.php >/dev/null

      - name: Validate Recently Viewed browser controller syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/ultimate-commerce-for-woocommerce/assets/js/recently-viewed.js

      - name: Validate Recently Viewed ownership and privacy contract
        shell: bash
        run: |
          set -euo pipefail
          php tests/recently-viewed-contract.php
