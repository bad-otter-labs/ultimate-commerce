name: Bootstrap PHP Quality Toolchain

on:
  push:
    branches:
      - phase4/php-quality-toolchain

permissions:
  contents: read

jobs:
  bootstrap-quality:
    runs-on: [self-hosted, Linux, X64, badotter, ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Composer
        shell: bash
        run: |
          set -euo pipefail
          php -r "copy('https://getcomposer.org/download/2.10.3/composer.phar', 'composer.phar');"
          echo "7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  composer.phar" | sha256sum -c -
          php composer.phar --version

      - name: Resolve pinned quality dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          php composer.phar config --global github-oauth.github.com "$GITHUB_TOKEN"
          php composer.phar validate --strict --no-check-lock
          php composer.phar update --no-interaction --no-progress --prefer-dist
          php composer.phar validate --strict
          php composer.phar show --direct

      - name: Capture WPCS report
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          vendor/bin/phpcs --standard=phpcs.xml.dist --report=full 2>&1 | tee wpcs-report.txt

      - name: Capture PHPCompatibility report
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          vendor/bin/phpcs --standard=phpcompatibility.xml.dist --report=full 2>&1 | tee phpcompat-report.txt

      - name: Capture PHPStan report
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --error-format=table 2>&1 | tee phpstan-report.txt

      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: php-quality-bootstrap-${{ github.sha }}
          path: |
            composer.lock
            wpcs-report.txt
            phpcompat-report.txt
            phpstan-report.txt
          if-no-files-found: error
          retention-days: 7
