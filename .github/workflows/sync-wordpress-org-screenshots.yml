name: Sync live WordPress.org screenshots

on:
  push:
    branches:
      - chore/sync-wordpress-org-assets
    paths:
      - '.github/workflows/sync-wordpress-org-screenshots.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/sync-wordpress-org-assets

      - name: Download live WordPress.org screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wordpress-org-assets
          for n in 1 2 3 4; do
            curl -fsSL               "https://ps.w.org/bad-otter-ultimate-commerce-woocommerce/assets/screenshot-${n}.png"               -o "wordpress-org-assets/screenshot-${n}.png"
          done
          python3 scripts/check-wordpress-org-assets.py

      - name: Commit synced screenshots
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- wordpress-org-assets; then
            echo "WordPress.org screenshot assets already match the repository."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress-org-assets
          git commit -m "Assets: sync live WordPress.org screenshots"
          git push origin HEAD:chore/sync-wordpress-org-assets
