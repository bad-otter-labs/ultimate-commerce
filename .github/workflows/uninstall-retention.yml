name: Validate Ultimate Commerce Uninstall Retention

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  uninstall-retention:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'badotter' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate uninstall and retention contract
        shell: bash
        run: |
          set -euo pipefail
          php -l packages/ultimate-commerce-for-woocommerce/src/Support/Settings.php
          php -l packages/ultimate-commerce-for-woocommerce/src/Security/Capabilities.php
          php -l packages/ultimate-commerce-for-woocommerce/src/Privacy/Uninstall.php
          php -l packages/ultimate-commerce-for-woocommerce/src/Admin/SettingsPage.php
          php -l packages/ultimate-commerce-for-woocommerce/uninstall.php
          php -l tests/uninstall-retention-contract.php
          php tests/uninstall-retention-contract.php

          python3 - <<'PY'
          from pathlib import Path

          root = Path('packages/ultimate-commerce-for-woocommerce')
          uninstall_entry = (root / 'uninstall.php').read_text()
          uninstall = (root / 'src/Privacy/Uninstall.php').read_text()
          settings = (root / 'src/Support/Settings.php').read_text()
          page = (root / 'src/Admin/SettingsPage.php').read_text()
          transfer = (root / 'src/Support/SettingsTransfer.php').read_text()

          if "defined('WP_UNINSTALL_PLUGIN')" not in uninstall_entry:
              raise SystemExit('Canonical uninstall entrypoint must fail closed outside WordPress uninstall context')
          if "Uninstall::run();" not in uninstall_entry:
              raise SystemExit('Canonical uninstall entrypoint must delegate to the bounded uninstall service')
          for prefix in ('uc_lock_', 'uc_idem_', 'uc_replay_', '_transient_uc_rl_', '_transient_timeout_uc_rl_'):
              if prefix not in uninstall:
                  raise SystemExit(f'Runtime cleanup prefix missing: {prefix}')
          if 'woocommerce_' in uninstall.lower() or 'DROP TABLE' in uninstall.upper():
              raise SystemExit('Free uninstall must not delete WooCommerce-owned data or drop arbitrary tables')
          if "LIKE 'uc_%'" in uninstall or 'uc_%' in uninstall:
              raise SystemExit('Uninstall must not use a broad uc_* database sweep')
          if 'UNINSTALL_DATA_OPTION' not in settings or 'updateDeleteDataOnUninstall' not in settings:
              raise SystemExit('Merchant uninstall preference contract is missing')
          if 'admin_post_uc_settings_retention' not in page or "PURPOSE_RETENTION = 'settings_retention'" not in page:
              raise SystemExit('Retention preference must use the settings admin-post/CSRF boundary')
          if 'Capabilities::MANAGE_SETTINGS' not in page:
              raise SystemExit('Retention preference must require the exact UC settings capability')
          if 'uc_delete_data_on_uninstall' in transfer:
              raise SystemExit('Destructive local uninstall choice must never be portable through settings transfer')

          print('Ultimate Commerce uninstall/data-retention source boundary validated')
          PY
