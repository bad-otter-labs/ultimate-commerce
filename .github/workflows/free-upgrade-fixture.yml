name: Validate Free Upgrade Fixture

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '.github/workflows/free-upgrade-fixture.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'packages/ultimate-commerce-for-woocommerce/src/Plugin.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Support/OptionMigrator.php'
      - 'packages/ultimate-commerce-for-woocommerce/ultimate-commerce-for-woocommerce.php'
      - 'tests/free-identity-upgrade-fixture.php'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/free-upgrade-fixture.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'packages/ultimate-commerce-for-woocommerce/src/Plugin.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Support/OptionMigrator.php'
      - 'packages/ultimate-commerce-for-woocommerce/ultimate-commerce-for-woocommerce.php'
      - 'tests/free-identity-upgrade-fixture.php'

permissions:
  contents: read

jobs:
  free-upgrade-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate upgrade fixture syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l packages/ultimate-commerce-for-woocommerce/src/Support/OptionMigrator.php >/dev/null
          php -l tests/free-identity-upgrade-fixture.php >/dev/null

      - name: Validate released 0.1.4 data migration
        shell: bash
        run: |
          set -euo pipefail
          php tests/free-identity-upgrade-fixture.php
