name: Validate Ultimate Commerce Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'badotter' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate governance source files
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/ultimate-commerce-for-woocommerce/src/Privacy/DataClassification.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Privacy/DataRetention.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Privacy/PersonalDataRegistry.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Contracts/AuditSink.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Audit/AuditEvent.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Audit/Audit.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Audit/HookAuditSink.php
          test -f docs/audit-privacy-foundations.md
          test -f tests/audit-privacy-foundations.php

      - name: Validate governance syntax and regressions
        shell: bash
        run: |
          set -euo pipefail
          php -l packages/ultimate-commerce-for-woocommerce/src/Privacy/DataClassification.php
          php -l packages/ultimate-commerce-for-woocommerce/src/Privacy/DataRetention.php
          php -l packages/ultimate-commerce-for-woocommerce/src/Privacy/PersonalDataRegistry.php
          php -l packages/ultimate-commerce-for-woocommerce/src/Contracts/AuditSink.php
          php -l packages/ultimate-commerce-for-woocommerce/src/Audit/AuditEvent.php
          php -l packages/ultimate-commerce-for-woocommerce/src/Audit/Audit.php
          php -l packages/ultimate-commerce-for-woocommerce/src/Audit/HookAuditSink.php
          php -l tests/audit-privacy-foundations.php
          php tests/audit-privacy-foundations.php

      - name: Validate public audit and privacy contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('packages/ultimate-commerce-for-woocommerce')
          entry = (root / 'ultimate-commerce-for-woocommerce.php').read_text()
          plugin = (root / 'src/Plugin.php').read_text()
          classification = (root / 'src/Privacy/DataClassification.php').read_text()
          registry = (root / 'src/Privacy/PersonalDataRegistry.php').read_text()
          audit = (root / 'src/Audit/AuditEvent.php').read_text()
          sink = (root / 'src/Audit/HookAuditSink.php').read_text()

          versions = {
              'ULTIMATE_COMMERCE_AUDIT_API_VERSION': '1.0.0',
              'ULTIMATE_COMMERCE_PRIVACY_API_VERSION': '1.0.0',
          }
          for constant, expected in versions.items():
              match = re.search(rf"define\('{constant}',\s*'([^']+)'\)", entry)
              if not match or match.group(1) != expected:
                  raise SystemExit(f'{constant} must remain {expected}')

          for value in ('public', 'merchant_operational', 'personal', 'credential_secret'):
              if repr(value) not in classification and f"'{value}'" not in classification:
                  raise SystemExit(f'Data classification vocabulary is missing {value}')

          if "wp_privacy_personal_data_exporters" not in registry or "wp_privacy_personal_data_erasers" not in registry:
              raise SystemExit('Personal data registry must integrate with WordPress exporter/eraser filters')
          if "uc_register_personal_data_handlers" not in registry:
              raise SystemExit('Public personal-data registration action is missing')
          if 'PersonalDataRegistry::hooks();' not in plugin:
              raise SystemExit('Privacy hooks must be registered by the Free plugin')
          if plugin.index('PersonalDataRegistry::hooks();') > plugin.index("if (!class_exists('WooCommerce'))"):
              raise SystemExit('Privacy hooks must be available even when WooCommerce is temporarily inactive')

          if 'DataClassification::MERCHANT_OPERATIONAL' not in audit or 'DataRetention::OPERATIONAL_HISTORY' not in audit:
              raise SystemExit('Audit events must carry operational classification and retention metadata')
          for forbidden_guard in ('password', 'secret', 'token', 'authorization', 'credential'):
              if forbidden_guard not in audit:
                  raise SystemExit(f'Audit context guard is missing {forbidden_guard}')
          if "do_action('uc_audit_event', $event)" not in sink:
              raise SystemExit('Default audit sink must emit structured uc_audit_event hook')
          if 'error_log' in sink or 'update_option' in sink or 'add_option' in sink:
              raise SystemExit('Default audit sink must not persist events into generic logs/options')

          print('Audit and privacy public contracts validated')
          PY
