name: Validate Public CI Trust Boundary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '.github/workflows/ci-trust-boundary.yml'
      - 'tests/ci-trust-boundary.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci-trust-boundary.yml'
      - 'tests/ci-trust-boundary.py'

permissions:
  contents: read

jobs:
  ci-trust-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate untrusted and trusted runner boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ci-trust-boundary.py
