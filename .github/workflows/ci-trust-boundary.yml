name: Validate Public CI Trust Boundary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-trust-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate untrusted and trusted runner boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ci-trust-boundary.py
