name: Validate Public CI Trust Boundary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '.github/workflows/ci-trust-boundary.yml'
      - '.github/workflows/**'
      - 'tests/ci-trust-boundary.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci-trust-boundary.yml'
      - '.github/workflows/**'
      - 'tests/ci-trust-boundary.py'

permissions:
  contents: read

jobs:
  ci-trust-boundary:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","badotter","ci-fast"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate untrusted and trusted runner boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ci-trust-boundary.py
