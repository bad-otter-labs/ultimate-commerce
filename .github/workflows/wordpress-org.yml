name: Validate WordPress.org Package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-review:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'badotter' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Isolate Plugin Check wp-env state
        shell: bash
        run: |
          set -euo pipefail
          echo "WP_ENV_HOME=$RUNNER_TEMP/plugin-check-wp-env-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Validate WordPress.org directory assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-wordpress-org-assets.py

      - name: Build and statically inspect canonical Free package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-wporg wporg-check
          python3 scripts/build-wordpress-org-package.py \
            --source packages/ultimate-commerce-for-woocommerce \
            --output-dir dist-wporg
          package="$(printf '%s\n' dist-wporg/*.zip)"
          test -f "$package"
          python3 scripts/check-wordpress-org-package.py "$package"
          mkdir -p wporg-check
          unzip -q "$package" -d wporg-check
          test -f wporg-check/ultimate-commerce-for-woocommerce/ultimate-commerce-for-woocommerce.php

      # plugin-check-action@v1 installs @wordpress/env@latest internally. Pin
      # the Docker-based toolchain here so an upstream npm publication race cannot
      # prevent Plugin Check from running against an otherwise unchanged candidate.
      - name: Set up Node for Plugin Check
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned wp-env
        shell: bash
        run: |
          set -euo pipefail
          npm -g --no-fund install @wordpress/env@10.25.0
          wp-env --version

      - name: Start isolated Plugin Check environment
        shell: bash
        run: |
          set -euo pipefail
          cat > .wp-env.json <<EOF
          {
            "core": null,
            "port": 8880,
            "testsPort": 8881,
            "mappings": {
              "wp-content/plugins/ultimate-commerce-for-woocommerce": "$(realpath wporg-check/ultimate-commerce-for-woocommerce)"
            }
          }
          EOF
          wp-env start --update
          wp-env run cli wp cli info

      - name: Run official WordPress Plugin Check
        shell: bash
        run: |
          set -euo pipefail
          wp-env run cli wp plugin install plugin-check --activate
          wp-env run cli wp plugin install woocommerce --activate
          wp-env run cli wp plugin activate ultimate-commerce-for-woocommerce

          results="$RUNNER_TEMP/plugin-check-results.txt"
          wp-env run cli wp plugin check ultimate-commerce-for-woocommerce \
            --format=json \
            --ignore-codes=WordPress.WP.I18n.NonSingularStringLiteralText \
            --exclude-files=.wp-env.json \
            --slug=ultimate-commerce-for-woocommerce \
            --require=./wp-content/plugins/plugin-check/cli.php > "$results"

          cat "$results"

          # Submission gate is deliberately strict: any warning/error changes the
          # Plugin Check output and must fail instead of being silently accepted.
          grep -Fx 'Success: Checks complete. No errors found.' "$results"

      - name: Stop Plugin Check environment
        if: ${{ always() }}
        shell: bash
        run: wp-env stop || true

      - name: Retain exact validated WordPress.org candidate
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-commerce-for-woocommerce-wporg-${{ github.sha }}
          path: |
            dist-wporg/*.zip
            dist-wporg/*.sha256
          if-no-files-found: error
          retention-days: 30
