name: Bad Otter Draft Fast

on:
  pull_request:
    types: [opened, reopened, synchronize, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ format('uc-free-draft-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  draft-fast:
    name: draft-fast
    if: ${{ github.event.pull_request.draft }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","badotter","ci-fast"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run fixed draft checks
        run: test -x scripts/ci/draft && scripts/ci/draft
