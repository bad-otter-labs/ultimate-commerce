name: Validate Ultimate Commerce Account and Order Contract

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '.github/workflows/account-order-contract.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'packages/ultimate-commerce-for-woocommerce/src/Account/AccountHooks.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Account/AccountViewModel.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Account/OrderViewModel.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Modules/Account/AccountModule.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Plugin.php'
      - 'packages/ultimate-commerce-for-woocommerce/ultimate-commerce-for-woocommerce.php'
      - 'tests/account-order-contract.php'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/account-order-contract.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'packages/ultimate-commerce-for-woocommerce/src/Account/AccountHooks.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Account/AccountViewModel.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Account/OrderViewModel.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Modules/Account/AccountModule.php'
      - 'packages/ultimate-commerce-for-woocommerce/src/Plugin.php'
      - 'packages/ultimate-commerce-for-woocommerce/ultimate-commerce-for-woocommerce.php'
      - 'tests/account-order-contract.php'

permissions:
  contents: read

jobs:
  account-order-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate account/order PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l packages/ultimate-commerce-for-woocommerce/src/Account/OrderViewModel.php >/dev/null
          php -l packages/ultimate-commerce-for-woocommerce/src/Account/AccountViewModel.php >/dev/null
          php -l packages/ultimate-commerce-for-woocommerce/src/Account/AccountHooks.php >/dev/null
          php -l packages/ultimate-commerce-for-woocommerce/src/Modules/Account/AccountModule.php >/dev/null
          php -l tests/account-order-contract.php >/dev/null

      - name: Validate ownership and HPOS-safe presentation contract
        shell: bash
        run: |
          set -euo pipefail
          php tests/account-order-contract.php
