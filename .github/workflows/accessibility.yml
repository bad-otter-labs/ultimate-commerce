name: Validate Storefront Accessibility Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'badotter' }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate pinned accessibility toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-accessibility-toolchain.py
          docker --version
          docker manifest inspect mcr.microsoft.com/playwright:v1.63.0-noble >/dev/null

      - name: Run live browser accessibility baseline
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-accessibility-baseline.sh
