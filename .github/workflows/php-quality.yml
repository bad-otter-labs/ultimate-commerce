name: Validate PHP Quality and Dependencies

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '.github/workflows/php-quality.yml'
      - 'packages/ultimate-commerce-for-woocommerce/**'
      - 'composer.json'
      - 'composer.lock'
      - 'scripts/check-quality-dependency-licenses.py'
      - 'packages/ultimate-commerce/**'
      - 'phpcompatibility.xml.dist'
      - 'phpcs.xml.dist'
      - 'phpstan-bootstrap.php'
      - 'phpstan.neon'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/php-quality.yml'
      - 'packages/ultimate-commerce-for-woocommerce/**'
      - 'composer.json'
      - 'composer.lock'
      - 'scripts/check-quality-dependency-licenses.py'
      - 'packages/ultimate-commerce/**'
      - 'phpcompatibility.xml.dist'
      - 'phpcs.xml.dist'
      - 'phpstan-bootstrap.php'
      - 'phpstan.neon'

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PHP baseline and install pinned Composer
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (version_compare(PHP_VERSION, "8.1.0", "<")) { fwrite(STDERR, "PHP 8.1+ is required for the quality gate.\\n"); exit(1); } echo "PHP " . PHP_VERSION . "\\n";'
          php -r "copy('https://getcomposer.org/download/2.10.3/composer.phar', 'composer.phar');"
          echo "7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  composer.phar" | sha256sum -c -
          php composer.phar --version

      - name: Install locked quality dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          php composer.phar config --global github-oauth.github.com "$GITHUB_TOKEN"
          php composer.phar validate --strict
          php composer.phar install --no-interaction --no-progress --prefer-dist
          php composer.phar show --direct

      - name: Audit dependencies and licences
        shell: bash
        run: |
          set -euo pipefail
          php composer.phar audit --locked
          python3 scripts/check-quality-dependency-licenses.py

      - name: Run review-focused WPCS
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Validate PHP 8.1+ compatibility
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpcs --standard=phpcompatibility.xml.dist

      - name: Run PHPStan
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress
