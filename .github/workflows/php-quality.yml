name: Validate PHP Quality and Dependencies

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'badotter' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:2.10.3
          coverage: none

      - name: Install locked quality dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          composer show --direct

      - name: Audit dependencies and licences
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked
          python3 scripts/check-quality-dependency-licenses.py

      - name: Run review-focused WPCS
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Validate PHP 8.1+ compatibility
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpcs --standard=phpcompatibility.xml.dist

      - name: Run PHPStan
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress
