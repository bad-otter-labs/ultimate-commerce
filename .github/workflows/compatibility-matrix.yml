name: Validate WordPress WooCommerce Compatibility Matrix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-compatibility:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'badotter' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.6.4'
            php: '8.1'
            woocommerce: '9.8.5'
            woocommerce_sha256: '9008e72eacda8f3bda01d0b704502eaddd8bc147651d61bd9aa7a015bf583964'
          - wordpress: '7.1.1'
            php: '8.3'
            woocommerce: '11.1.0'
            woocommerce_sha256: 'ab56c02b4e0b0685702408624822d8f598ba8f9a9333bcc3673b5da24e03e4f1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live WordPress/WooCommerce compatibility case
        shell: bash
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          PHP_VERSION: ${{ matrix.php }}
          WC_VERSION: ${{ matrix.woocommerce }}
          WC_SHA256: ${{ matrix.woocommerce_sha256 }}
        run: |
          set -euo pipefail
          bash scripts/run-compatibility-case.sh
