name: Validate Ultimate Commerce

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'badotter' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package roots
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/ultimate-commerce-for-woocommerce/ultimate-commerce-for-woocommerce.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Plugin.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Contracts/Module.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Contracts/AbstractModule.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Contracts/SecretStore.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Contracts/ReplayStore.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Support/ModuleRegistry.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Support/OptionMigrator.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Security/Capabilities.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Security/Authorization.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Security/Csrf.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Security/GuestToken.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Security/SecretStore.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Security/Secrets/EncryptedOptionSecretStore.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Security/Replay/OptionReplayStore.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Security/SignedWebhook.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Http/ProviderHttp.php
          test -f packages/ultimate-commerce-for-woocommerce/src/Rest/RouteRegistrar.php
          test -f docs/module-extension-contract-v1.md
          test -f docs/security-request-conventions.md
          test -f docs/external-boundary-security.md
          test -f tests/module-contract-v1.php
          test -f tests/security-request-foundations.php
          test -f tests/external-boundary-security.php
          test -f scripts/build-wordpress-org-package.py
          test -f packages/ultimate-commerce/ultimate-commerce.php
          test -f packages/ultimate-commerce/module.json
          test -f packages/ultimate-commerce/src/Updates/ManagedUpdates.php
          test -f scripts/build-plugin-package.py

      - name: Validate source syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            php -l "$file"
          done < <(find packages/ultimate-commerce-for-woocommerce packages/ultimate-commerce -type f -name '*.php' -print0)
          php -l tests/module-contract-v1.php
          php -l tests/security-request-foundations.php
          php -l tests/external-boundary-security.php
          python3 -m py_compile scripts/build-wordpress-org-package.py scripts/build-plugin-package.py

      - name: Validate public module extension contract v1
        shell: bash
        run: |
          set -euo pipefail
          php tests/module-contract-v1.php
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('packages/ultimate-commerce-for-woocommerce')
          entry = (root / 'ultimate-commerce-for-woocommerce.php').read_text()
          interface = (root / 'src/Contracts/Module.php').read_text()
          plugin = (root / 'src/Plugin.php').read_text()

          version = re.search(r"define\('ULTIMATE_COMMERCE_MODULE_API_VERSION',\s*'([^']+)'\)", entry)
          contract = re.search(r"CONTRACT_VERSION\s*=\s*'([^']+)'", interface)
          if not version or not contract or version.group(1) != contract.group(1):
              raise SystemExit('Module API version constant and Module::CONTRACT_VERSION must match')

          required_methods = ('key', 'name', 'product', 'tier', 'dependencies', 'compatibility', 'settingsSchema', 'assets', 'register')
          for method in required_methods:
              if f'function {method}(' not in interface:
                  raise SystemExit(f'Module contract is missing {method}()')

          if "do_action('ultimate_commerce_register_modules', $registry)" not in plugin:
              raise SystemExit('Public ultimate_commerce_register_modules registration action is missing')
          if '$registry->register(new $class());' not in plugin:
              raise SystemExit('Built-in modules are not using the public registry registration path')
          print('Public module extension contract v1 validated')
          PY

      - name: Validate security and request foundations
        shell: bash
        run: |
          set -euo pipefail
          php tests/security-request-foundations.php
          python3 - <<'PY'
          from pathlib import Path

          root = Path('packages/ultimate-commerce-for-woocommerce')
          diagnostics = (root / 'src/Admin/DiagnosticsPage.php').read_text()
          capabilities = (root / 'src/Security/Capabilities.php').read_text()
          routes = (root / 'src/Rest/RouteRegistrar.php').read_text()

          if 'manage_woocommerce' in diagnostics or 'manage_options' in diagnostics:
              raise SystemExit('UC diagnostics must use a dedicated UC capability')
          if 'Capabilities::VIEW_DIAGNOSTICS' not in diagnostics:
              raise SystemExit('UC diagnostics capability check is missing')
          if "ulticofo_view_diagnostics" not in capabilities or "ulticofo_manage_settings" not in capabilities:
              raise SystemExit('Required Phase 1 capability constants are missing')
          if "permission_callback" not in routes or "register_rest_route" not in routes:
              raise SystemExit('Strict UC REST route registrar is incomplete')
          print('Security and request foundations validated')
          PY

      - name: Validate external-boundary security foundations
        shell: bash
        run: |
          set -euo pipefail
          php tests/external-boundary-security.php
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('packages/ultimate-commerce-for-woocommerce')
          entry = (root / 'ultimate-commerce-for-woocommerce.php').read_text()
          guest = (root / 'src/Security/GuestToken.php').read_text()
          secrets = (root / 'src/Security/Secrets/EncryptedOptionSecretStore.php').read_text()
          provider = (root / 'src/Http/ProviderHttp.php').read_text()
          replay = (root / 'src/Security/Replay/OptionReplayStore.php').read_text()
          webhook = (root / 'src/Security/SignedWebhook.php').read_text()

          version = re.search(r"define\('ULTIMATE_COMMERCE_SECURITY_API_VERSION',\s*'([^']+)'\)", entry)
          if not version or version.group(1) != '1.0.0':
              raise SystemExit('Security API v1 constant is missing')
          if "hash_hmac('sha256'" not in guest or 'hash_equals' not in guest or 'wp_salt' not in guest:
              raise SystemExit('Guest tokens must be purpose-bound HMAC tokens derived from WordPress salt material')
          if 'sodium_crypto_aead_xchacha20poly1305_ietf_encrypt' not in secrets or "aes-256-gcm" not in secrets:
              raise SystemExit('Secret Store must use authenticated encryption with Sodium/OpenSSL support')
          if "wp_salt('secure_auth')" not in secrets:
              raise SystemExit('Secret Store key material must derive from WordPress secure-auth salt')
          if 'wp_safe_remote_request' not in provider or "['redirection'] = 0" not in provider:
              raise SystemExit('Provider HTTP must use safe requests with redirects disabled')
          if "['sslverify'] = true" not in provider or "['reject_unsafe_urls'] = true" not in provider:
              raise SystemExit('Provider HTTP must force TLS and unsafe-URL rejection')
          if 'add_option(' not in replay or 'random_bytes(16)' not in replay:
              raise SystemExit('Replay store must atomically claim events with random leases')
          if "hash_hmac('sha256'" not in webhook or 'hash_equals' not in webhook or 'ReplayStore' not in webhook:
              raise SystemExit('Signed webhooks must verify HMAC and claim a replay store')
          print('External-boundary security foundations validated')
          PY

      - name: Validate WordPress.org Free identity and storage boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('packages/ultimate-commerce-for-woocommerce')
          plugin = (root / 'ultimate-commerce-for-woocommerce.php').read_text()
          composer = json.loads((root / 'composer.json').read_text())
          modules = (root / 'config/modules.php').read_text()
          settings = (root / 'src/Support/Settings.php').read_text()
          migrator = (root / 'src/Support/OptionMigrator.php').read_text()

          required_headers = {
              'Plugin Name': 'Ultimate Commerce for WooCommerce',
              'Text Domain': 'ultimate-commerce-for-woocommerce',
              'License': 'GPL v2 or later',
              'Requires Plugins': 'woocommerce',
          }
          for key, expected in required_headers.items():
              match = re.search(rf'^\s*\*\s*{re.escape(key)}:\s*(.+?)\s*$', plugin, re.M)
              if not match or match.group(1) != expected:
                  raise SystemExit(f'{key} must be {expected!r}')

          if re.search(r'^\s*\*\s*Update URI:', plugin, re.M):
              raise SystemExit('WordPress.org Free must not define a third-party Update URI')
          if composer.get('license') != 'GPL-2.0-or-later':
              raise SystemExit('Canonical Free composer license must be GPL-2.0-or-later')
          if (root / 'module.json').exists():
              raise SystemExit('Canonical WordPress.org Free package must not contain the Bad Otter product manifest')
          if 'ReturnsModule' in modules:
              raise SystemExit('Premium returns implementation must not be registered in canonical Free')
          if "private const MODULE_OPTION = 'ulticofo_modules';" not in settings:
              raise SystemExit('Canonical module settings must use the ulticofo_ prefix')
          for legacy, canonical in {
              'ultimate_commerce_version': 'ulticofo_version',
              'ultimate_commerce_schema_version': 'ulticofo_schema_version',
              'ultimate_commerce_modules': 'ulticofo_modules',
              'uc_version': 'ulticofo_version',
              'uc_schema_version': 'ulticofo_schema_version',
              'uc_modules': 'ulticofo_modules',
          }.items():
              if legacy not in migrator or canonical not in migrator:
                  raise SystemExit(f'Missing legacy option migration {legacy} -> {canonical}')
          print('WordPress.org Free identity and storage boundary validated')
          PY

      - name: Enforce WordPress.org Free distribution boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d packages/ultimate-commerce-for-woocommerce/src/Updates
          if grep -RniE 'Update URI:|api\.badotter\.io|ManagedUpdates|BadOtterClient|uc-bad-otter://' packages/ultimate-commerce-for-woocommerce; then
            echo 'Canonical Free contains private managed-update implementation or metadata.' >&2
            exit 1
          fi

      - name: Enforce reusable repository boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'FishingClothing|fishingclothing\.co\.uk' packages/ultimate-commerce-for-woocommerce packages/ultimate-commerce; then
            echo 'Store-specific FishingClothing references are forbidden in Ultimate Commerce packages.' >&2
            exit 1
          fi

      - name: Validate legacy 0.1.x migration bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('packages/ultimate-commerce')
          plugin = (root / 'ultimate-commerce.php').read_text()
          manifest = json.loads((root / 'module.json').read_text())
          if manifest.get('product') != 'ultimate-commerce' or manifest.get('id') != 'core':
              raise SystemExit('Legacy Bad Otter package identity changed unexpectedly')
          if 'Update URI: https://badotter.io/ultimate-commerce' not in plugin:
              raise SystemExit('Legacy bridge must retain its existing managed-update identity until migration is completed')
          if not (root / 'src/Updates/ManagedUpdates.php').is_file():
              raise SystemExit('Legacy bridge updater is missing')
          print('Legacy 0.1.x migration bridge validated')
          PY

      - name: Build deterministic WordPress.org Free package twice
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-wordpress-org-package.py --source packages/ultimate-commerce-for-woocommerce --output-dir dist-free-a >/tmp/uc-free-a.txt
          python3 scripts/build-wordpress-org-package.py --source packages/ultimate-commerce-for-woocommerce --output-dir dist-free-b >/tmp/uc-free-b.txt
          first="$(sha256sum dist-free-a/*.zip | awk '{print $1}')"
          second="$(sha256sum dist-free-b/*.zip | awk '{print $1}')"
          test "$first" = "$second"
          unzip -t dist-free-a/*.zip >/dev/null
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          package = next(Path('dist-free-a').glob('*.zip'))
          root = 'ultimate-commerce-for-woocommerce/'
          with zipfile.ZipFile(package) as zf:
              names = zf.namelist()
              if not names or any(not name.startswith(root) for name in names):
                  raise SystemExit('Free package contains files outside the canonical plugin root')
              required = root + 'ultimate-commerce-for-woocommerce.php'
              if required not in names:
                  raise SystemExit('Free package is missing the canonical plugin entry file')
              forbidden = {
                  root + 'module.json',
                  root + 'src/Updates/ManagedUpdates.php',
                  root + 'src/Updates/BadOtterClient.php',
              }
              if forbidden.intersection(names):
                  raise SystemExit('Free package contains private update/release files')
          print('Deterministic WordPress.org Free package validated')
          PY

      - name: Preserve deterministic legacy bridge package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-plugin-package.py --source packages/ultimate-commerce --output-dir dist-legacy-a >/tmp/uc-legacy-a.txt
          python3 scripts/build-plugin-package.py --source packages/ultimate-commerce --output-dir dist-legacy-b >/tmp/uc-legacy-b.txt
          first="$(sha256sum dist-legacy-a/*.zip | awk '{print $1}')"
          second="$(sha256sum dist-legacy-b/*.zip | awk '{print $1}')"
          test "$first" = "$second"
          unzip -t dist-legacy-a/*.zip >/dev/null
